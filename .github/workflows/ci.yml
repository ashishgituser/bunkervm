name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check bunkervm/
      - run: black --check bunkervm/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The local backend is the only thing that runs without KVM, and it's
          # what the macOS/Windows support claim rests on — so it has to be
          # tested on those platforms, not just assumed portable from Linux.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Import smoke test
        run: python tests/test_imports.py
      - name: Unit tests (no KVM required)
        run: pytest tests/test_imports.py tests/test_features.py -v
      - name: Local backend end-to-end
        # Runs the exact command the README points macOS/no-KVM users at.
        # Unit tests can pass while the real CLI path is broken.
        run: bunkervm demo --local
